<script type="text/babel" data-type="module">
import React, { useState, useEffect, useRef, useMemo } from "react";
import { createRoot } from "react-dom/client";

const recognitionErrors = {
  "not-allowed": "주소창에서 마이크를 허용한 뒤 대사창을 눌러 주세요.",
  "service-not-allowed": "브라우저에서 음성 인식을 사용할 수 없어요. Chrome 설정을 확인해 주세요.",
  "audio-capture": "마이크를 연결하거나 입력 장치를 확인한 뒤 대사창을 눌러 주세요.",
  "language-not-supported": "이 브라우저에서는 한국어 음성 인식을 사용할 수 없어요.",
  network: "음성 인식 연결이 끊겼어요. 인터넷을 확인한 뒤 대사창을 눌러 주세요.",
};

let releasingInput;

function releaseInput(input) {
  let timeout;
  const release = new Promise((resolve) => {
    const done = () => {
      clearTimeout(timeout);
      resolve();
    };
    input.onend = done;
    timeout = setTimeout(done, 350);
    input.abort();
  });
  releasingInput = release;
  release.then(() => { if (releasingInput === release) releasingInput = null; });
}

function createVoiceSession({ update, onAnswer, onMiss }) {
  const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  const synth = window.speechSynthesis;
  let active = false;
  let turn = 0;
  let retry;
  let outputDeadline;
  let recognition;
  let utterance;
  let lastPrompt;
  let misses = 0;

  function stop() {
    active = false;
    turn++;
    clearTimeout(retry);
    clearTimeout(outputDeadline);
    if (recognition) {
      const input = recognition;
      recognition = null;
      releaseInput(input);
    }
    if (utterance) {
      utterance = null;
      synth.cancel();
    }
  }

  function fail(message) {
    stop();
    update({ phase: "error", message });
  }

  function listen(id) {
    if (!active || turn !== id) return;
    if (!Recognition) return fail("한국어 음성 인식은 Chrome에서 페이지를 열어 사용해 주세요.");
    if (!window.isSecureContext) return fail("마이크를 사용하려면 localhost 또는 HTTPS에서 열어 주세요.");

    const input = new Recognition();
    recognition = input;
    input.lang = "ko-KR";
    input.continuous = false;
    input.interimResults = true;
    input.maxAlternatives = 1;
    let final = "";
    let heardSpeech = false;
    let error;

    update({ phase: "waiting", transcript: "", message: "" });
    input.onaudiostart = () => {
      if (recognition === input) update({ phase: "listening" });
    };
    input.onspeechstart = () => { heardSpeech = true; };
    input.onresult = ({ results, resultIndex }) => {
      if (recognition !== input) return;
      const interim = [];
      for (let i = resultIndex; i < results.length; i++) {
        const result = results[i];
        if (result.isFinal) final += ` ${result[0].transcript}`;
        else interim.push(result[0].transcript);
      }
      update({ phase: "listening", transcript: [final, ...interim].join(" ").trim() });
    };
    input.onnomatch = () => { error = "no-match"; };
    input.onerror = (event) => {
      if (recognition !== input) return;
      error = event.error;
      if (recognitionErrors[error]) fail(recognitionErrors[error]);
    };
    input.onend = () => {
      if (recognition !== input || !active || turn !== id) return;
      recognition = null;
      const answer = final.trim();
      if (answer) {
        misses = 0;
        update({ phase: "thinking", transcript: answer });
        onAnswer(answer);
        return;
      }
      if (heardSpeech || error === "no-match" || ++misses === 2) {
        misses = 0;
        onMiss(heardSpeech || error === "no-match");
        return;
      }
      update({ phase: "waiting", transcript: "" });
      retry = setTimeout(() => listen(id), 450);
    };
    try {
      input.start();
    } catch {
      recognition = null;
      fail("마이크를 시작하지 못했어요. 대사창을 눌러 다시 시도해 주세요.");
    }
  }

  function say(text, { wait = true, after, display = text } = {}) {
    stop();
    lastPrompt = { text, wait, after, display };
    active = true;
    const id = turn;
    update({ phase: "speaking", line: display, message: "" });
    const finish = () => {
      if (!active || turn !== id) return;
      utterance = null;
      clearTimeout(outputDeadline);
      if (wait) {
        update({ phase: "waiting", transcript: "" });
        // Give the output device a short time to clear its audio buffer.
        retry = setTimeout(() => listen(id), 220);
      } else {
        active = false;
        update({ phase: "idle", transcript: "" });
        after?.();
      }
    };
    if (!synth || !window.SpeechSynthesisUtterance) {
      fail("이 브라우저에서는 아바타 음성을 사용할 수 없어요.");
      return;
    }
    const output = new SpeechSynthesisUtterance(text);
    const korean = synth.getVoices().find((voice) => /^ko(?:[-_]|$)/i.test(voice.lang));
    if (korean) output.voice = korean;
    output.lang = "ko-KR";
    output.rate = 0.9;
    output.onend = finish;
    output.onerror = ({ error }) => {
      if (!active || turn !== id) return;
      fail(error === "not-allowed"
        ? "대사창을 눌러 음성 대화를 시작해 주세요."
        : "한국어 음성을 재생하지 못했어요. 브라우저의 한국어 음성을 확인해 주세요.");
    };
    const speak = () => {
      if (!active || turn !== id) return;
      utterance = output;
      outputDeadline = setTimeout(() => {
        if (active && turn === id) fail("음성 재생을 시작하지 못했어요. 대사창을 눌러 다시 시도해 주세요.");
      }, Math.max(15000, text.length * 320));
      synth.speak(output);
    };
    if (releasingInput) releasingInput.then(speak);
    else speak();
  }

  return {
    say,
    stop,
    pause() {
      stop();
      update({ phase: "idle", transcript: "" });
    },
    restart() {
      if (lastPrompt) say(lastPrompt.text, lastPrompt);
    },
  };
}

const CREAM = "#FFF8EE";

const pad = (n) => String(n).padStart(2, "0");
const keyOf = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const HOUR_WORDS = { 한: 1, 두: 2, 세: 3, 네: 4, 다섯: 5, 여섯: 6, 일곱: 7, 여덟: 8, 아홉: 9, 열한: 11, 열두: 12, 열: 10 };
const todayKeyNow = () => keyOf(new Date());
const dateLabel = (k) => {
  const t = new Date(todayKeyNow()), d = new Date(k);
  const diff = Math.round((d - t) / 86400000);
  if (diff === 0) return "오늘";
  if (diff === 1) return "내일";
  if (diff === 2) return "모레";
  return `${d.getMonth() + 1}월 ${d.getDate()}일(${"일월화수목금토"[d.getDay()]})`;
};
const spokenTime = (x) => `${x.pm ? "오후" : "오전"} ${x.h}시${x.m ? ` ${x.m}분` : ""}`;
const tmin = (x) => ((x.h % 12) + (x.pm ? 12 : 0)) * 60 + x.m;

/* "오후 3시", "열두 시", "6시 반" → { h, m, pm, raw } */
function readTime(str) {
  const tm = str.match(/(오전|오후|아침|점심|저녁|밤|새벽)?\s*(\d{1,2}|열한|열두|열|한|두|세|네|다섯|여섯|일곱|여덟|아홉)\s*시\s*(반|\d{1,2}\s*분)?/);
  if (!tm) return null;
  const hr = /^\d/.test(tm[2]) ? +tm[2] : HOUR_WORDS[tm[2]];
  const m = tm[3] === "반" ? 30 : tm[3] ? parseInt(tm[3], 10) : 0;
  const ap = tm[1];
  let h, pm;
  if (hr > 12) { pm = true; h = hr - 12; }
  else if (hr === 0) { pm = false; h = 12; }
  else { h = hr; pm = ap && /오전|아침|새벽/.test(ap) ? false : ap ? true : hr === 12 || hr <= 6; }
  return { h, m, pm: !!pm, raw: tm[0] };
}

/* "경로당 가기 일정 지워줘" → 지울 일정 찾기: { kind: "none" | "one" | "many", todo?, list? } */
const DELETE_INTENT = /(지워|지우|삭제|취소해|취소 해|취소할|빼\s?줘|빼\s?주|없애)/;
function findTodoToDelete(raw, todos) {
  const tm = readTime(raw);
  const words = raw.replace(/\d{1,2}\s*월\s*\d{1,2}\s*일/g, " ").replace(tm ? tm.raw : "", " ")
    .replace(/(지워|지우|삭제|취소|빼|없애|줘|주세요|해줘|해 줘|해주세요|좀|일정|할 일|할일|오늘|내일|모레|을|를|은|는|이|가|도|에서|에)/g, " ")
    .split(/\s+/).map((w) => w.trim()).filter((w) => w.length >= 2);
  const ALIAS = { 병원: ["검진", "진료", "내과", "치과", "병원"], 장보기: ["사기", "장"], 약: ["약"] };
  const all = words.flatMap((w) => [w, ...(ALIAS[w] || [])]);
  let c = todos.filter((x) => all.some((w) => x.text.replace(/\s/g, "").includes(w)));
  if (!c.length) return { kind: "none" };
  if (tm) { const byTime = c.filter((x) => x.h === tm.h && x.m === tm.m && x.pm === tm.pm); if (byTime.length) c = byTime; }
  return c.length === 1 ? { kind: "one", todo: c[0] } : { kind: "many", list: c };
}

/* "10월 12일 오후 3시에 친구들과 모임이 있어" → { dateKey, h, m, pm, title } */
function parseSchedule(raw) {
  let rest = raw.replace(/\s+/g, " ").trim();
  const now = new Date();
  let date = null, m;
  if ((m = rest.match(/(\d{1,2})\s*월\s*(\d{1,2})\s*일/))) {
    date = new Date(now.getFullYear(), +m[1] - 1, +m[2]);
    if (keyOf(date) < keyOf(now)) date.setFullYear(date.getFullYear() + 1);
    rest = rest.replace(m[0], " ");
  } else if ((m = rest.match(/(오늘|내일|모레|글피)/))) {
    date = new Date(now); date.setDate(now.getDate() + { 오늘: 0, 내일: 1, 모레: 2, 글피: 3 }[m[1]]);
    rest = rest.replace(m[0], " ");
  } else if ((m = rest.match(/(이번\s*주|다음\s*주)?\s*([일월화수목금토])요일/))) {
    const ti = (("일월화수목금토".indexOf(m[2])) + 6) % 7, mon = new Date(now); mon.setDate(now.getDate() - monIdx(now));
    date = new Date(mon);
    if (m[1] && /다음/.test(m[1])) date.setDate(mon.getDate() + 7 + ti);
    else if (m[1]) date.setDate(mon.getDate() + ti);
    else { let diff = (ti - monIdx(now) + 7) % 7; date.setTime(now.getTime()); date.setDate(now.getDate() + (diff === 0 ? 7 : diff)); }
    rest = rest.replace(m[0], " ");
  }
  let h = 9, mi = 0, pm = false, noTime = true;
  const tm = readTime(rest);
  if (tm) { noTime = false; ({ h, m: mi, pm } = tm); rest = rest.replace(tm.raw, " "); }
  const intent = /(있|약속|모임|만나|가야|가기|예약|검진|병원|행사|잔치|생신|가요|간다|갈|해야|오기로|오는)/.test(raw);
  if ((!date && noTime) || !intent) return null;
  let title = rest.replace(/\s+/g, " ").trim().replace(/^(에는|에|은|는|부터|까지)\s*/, "");
  title = title.replace(/[.!?~]+$/g, "").replace(/\s*(이|가|은|는)?\s*(있어요?|있단다|있다|있네|있대|있거든|있어서|있습니다|잡혔어요?|잡혀 있어요?|예정이야|예정이에요|예정입니다)$/, "").trim();
  return { dateKey: keyOf(date || now), h, m: mi, pm, title: title || "새 일정", noTime };
}

const pick = (a) => a[Math.floor(Math.random() * a.length)];

const WMO = (c) => (c === 0 ? ["맑음", "☀️"] : c <= 2 ? ["대체로 맑음", "🌤️"] : c === 3 ? ["흐림", "☁️"] : c <= 48 ? ["안개 낀 날씨", "🌫️"] : c <= 67 ? ["비", "🌧️"] : c <= 77 ? ["눈", "❄️"] : c <= 82 ? ["소나기", "🌦️"] : ["천둥번개", "⛈️"]);
const rainy = (code, pop) => (code >= 51 && code <= 67) || (code >= 80 && code <= 99) || pop >= 60;

/* 오늘·내일 날씨 (Open-Meteo, 서울 기준). 불러오지 못하면 null */
async function fetchWeather() {
  try {
    const ctrl = new AbortController(); const to = setTimeout(() => ctrl.abort(), 5000);
    const r = await fetch("https://api.open-meteo.com/v1/forecast?latitude=37.5665&longitude=126.978&current=temperature_2m,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&forecast_days=2&timezone=Asia%2FSeoul", { signal: ctrl.signal });
    clearTimeout(to);
    const j = await r.json();
    return {
      temp: Math.round(j.current.temperature_2m), code: j.current.weather_code,
      hi: Math.round(j.daily.temperature_2m_max[0]), lo: Math.round(j.daily.temperature_2m_min[0]), pop: j.daily.precipitation_probability_max[0],
      tCode: j.daily.weather_code[1], tHi: Math.round(j.daily.temperature_2m_max[1]), tLo: Math.round(j.daily.temperature_2m_min[1]), tPop: j.daily.precipitation_probability_max[1],
    };
  } catch { return null; }
}
const tipFor = (code, pop, t) => (rainy(code, pop) ? "우산 꼭 챙기세요! ☂️" : t <= 5 ? "많이 추워요. 따뜻하게 입으세요! 🧣" : t >= 28 ? "더워요. 물 자주 드세요! 💧" : t <= 12 ? "쌀쌀하니 겉옷 챙기세요!" : "산책하기 딱 좋은 날씨예요! 🚶");
const weatherLine = (w) => { const [d] = WMO(w.code); return `오늘은 ${d}, 지금 ${w.temp}도예요. 낮 최고 ${w.hi}도, 아침엔 ${w.lo}도래요. ${tipFor(w.code, w.pop, w.hi)}`; };

const QUIZ_INTENT = /(농담|웃긴|웃겨|재밌는|재미있는|조크|수수께끼|퀴즈|아재|하나 더|장난)/;

const YES = /^(응|네|예|그래|좋아|좋지|해\s?봐|해줘|내\s?봐|그러자|어)/;

const chatReply = (t) => {
  if (/아프|쑤시|결리|어지/.test(t)) return `많이 불편하시겠어요. 따뜻하게 쉬세요. ${pick(["언제부터 아프셨어요?", "약은 챙겨 드셨어요?"])}`;
  if (/고마워|감사/.test(t)) return pick(["에이~ 별말씀을요! 웃으시는 모습이 최고예요 😊 오늘 또 뭐 하셨어요?", "저도 고마워요~ 우리 오래오래 얘기해요 🥰"]);
  if (/안녕|좋은 아침|굿모닝|잘 잤/.test(t)) return pick(["안녕하세요~! 보고 싶었어요 🥰 오늘 기분은 어떠세요?", "어머, 목소리 들으니까 힘이 나요! 식사는 하셨어요?"]);
  if (/외로|쓸쓸|보고\s?싶|심심/.test(t)) return pick(["저도 보고 싶었어요~ 🥰 이렇게 목소리 들려주시니 너무 좋아요! 수수께끼 하나 낼까요?", "제가 곁에 있잖아요~ 심심하면 저랑 놀아요! 수수께끼 낼까요?"]);
  if (/기분.*좋|좋아|행복|즐거/.test(t)) return `기분이 좋으시다니 저도 기뻐요! 무슨 좋은 일 있으셨어요?`;
  if (/밥|점심|저녁|식사|먹/.test(t)) return `잘 챙겨 드셨네요! 반찬은 뭐가 제일 맛있었어요?`;
  return pick(["말씀해 주셔서 고마워요~ 더 들려주세요! 오늘 제일 기억에 남는 일은 뭐예요?", "오오 그렇군요! 그래서 어떻게 됐어요? 궁금해요~", "목소리 들으니까 좋아요 💛 다른 얘기도 해 주세요!"]);
};

const HOME_SAMPLE = "오늘의 날씨는 13°C 입니다. 비가 온다고 하니 우산 꼭 챙기세요.";
const HOME_GREETING = "안녕하세요! 오늘 하루는 어떠세요?";

function voiceBox(x, y, w, h) {
  return { "--x": x, "--y": y, "--w": w, "--h": h };
}

function VoiceButton({ box, label, asset, onClick, ...props }) {
  return (
    <button type="button" className="voice-position voice-hotspot" style={voiceBox(...box)}
      aria-label={label} onClick={onClick} {...props}>
      {asset && <img src={asset} alt="" draggable="false" />}
    </button>
  );
}

function useVoice({ initial, onAnswer, onMiss }) {
  const [state, setState] = useState({ phase: "idle", line: initial, transcript: "", message: "" });
  const events = useRef({});
  events.current = { onAnswer, onMiss };
  const session = useMemo(() => createVoiceSession({
    update: (next) => setState((previous) => ({ ...previous, ...next })),
    onAnswer: (text) => events.current.onAnswer(text),
    onMiss: (heard) => events.current.onMiss(heard),
  }), []);
  useEffect(() => () => session.stop(), [session]);
  return [state, session];
}

function VoiceCaption({ voice, box, sample, onClick }) {
  const labels = {
    waiting: "음성 입력을 준비하고 있어요",
    listening: "듣고 있어요",
    thinking: "말씀하신 내용을 확인하고 있어요",
  };
  const status = voice.message || labels[voice.phase];
  const listening = voice.phase === "listening" || voice.phase === "thinking";
  const line = voice.message || (listening && voice.transcript) || voice.line;
  const changed = line !== sample;
  return (
    <>
      <button type="button" className="voice-position voice-hotspot voice-caption"
        style={voiceBox(...box)} data-changed={changed}
        aria-label={"음성 대화 시작 또는 다시 듣기. " + line} onClick={onClick}>
        {changed && <span className="voice-caption-line" data-status={!!status && !voice.message}>{line}</span>}
        {status && !voice.message && <span className="voice-caption-phase" aria-hidden="true">{status}</span>}
      </button>
      <div aria-live="polite" aria-atomic="true" className="voice-note sr-only">
        {status && <span>{status}</span>}
        {voice.transcript && <span>{voice.transcript}</span>}
      </div>
    </>
  );
}

function Main({ todos, deleteTodo, addTodo, toast, weather }) {
  const quiz = useRef(null);
  const quizIdx = useRef(Math.floor(Math.random() * QUIZ.length));
  const offer = useRef(false);
  const [voice, session] = useVoice({
    initial: HOME_SAMPLE,
    onAnswer: handle,
    onMiss: (heard) => heard ? say("잘 듣지 못했어요. 다시 한 번 말씀해 주세요.") : session.pause(),
  });
  const say = (text) => session.say(text);
  const begin = () => session.say(HOME_GREETING, { display: HOME_SAMPLE });
  useEffect(() => {
    session.say(HOME_GREETING, { display: HOME_SAMPLE });
  }, [session]);

  const cards = todos.filter((item) => item.dateKey === keyOf(new Date()))
    .sort((a, b) => tmin(a) - tmin(b)).slice(0, 2);

  const askQuiz = () => {
    const q = QUIZ[quizIdx.current++ % QUIZ.length];
    quiz.current = q; offer.current = false;
    say("수수께끼 나갑니다. " + q.q + " 맞혀 보세요!");
  };

  function handle(raw) {
    const t = (raw || "").trim();
    if (!t) return say("잘 못 들었어요~ 다시 한 번만 말씀해 주세요 🥺");
    const wasOffer = offer.current; offer.current = false;

    // 1) 수수께끼 정답 맞히기
    if (quiz.current) {
      const q = quiz.current;
      const isOther = DELETE_INTENT.test(t) || WEATHER_INTENT.test(t) || parseSchedule(t);
      if (!isOther) {
        quiz.current = null; offer.current = true;
        if (q.keys.some((k) => t.replace(/\s/g, "").includes(k.replace(/\s/g, "")))) return say(`딩동댕~! 정답은 '${q.a}'예요 👏 척척박사시네요! 하나 더 낼까요?`);
        if (/모르|몰라|힌트|포기|글쎄/.test(t)) return say(`정답은 '${q.a}'예요! ㅎㅎ 재밌죠? 하나 더 낼까요?`);
        return say(`땡~! 정답은 '${q.a}'예요 ㅎㅎ 아깝다~ 하나 더 낼까요?`);
      }
      quiz.current = null;
    }
    // 2) 일정 삭제 · 추가
    if (DELETE_INTENT.test(t)) {
      const r = findTodoToDelete(t, todos);
      if (r.kind === "one") { deleteTodo(r.todo.id); return say(`${dateLabel(r.todo.dateKey)} ${spokenTime(r.todo)} '${r.todo.text}' 일정을 삭제했어요.`); }
      if (r.kind === "many") return say(`'${r.list[0].text}' 일정이 ${r.list.length}개예요. 시간도 같이 말씀해 주세요. 예) ${spokenTime(r.list[0])} ${r.list[0].text} 지워줘`);
      return say("어떤 일정인지 못 찾았어요. 일정 이름을 같이 말씀해 주세요.");
    }
    const sc = parseSchedule(t);
    if (sc) {
      addTodo(sc);
      say(`${dateLabel(sc.dateKey)} ${spokenTime(sc)}에 '${sc.title}' 일정을 추가했어요!${sc.noTime ? " 시간은 오전 9시로 해 뒀어요." : ""} 그날 기대되시죠? 😊`);
      toast("📅 일정에 자동으로 추가했어요");
      return;
    }
    // 3) 날씨
    if (WEATHER_INTENT.test(t)) {
      const w = weather;
      return say(w ? `${WMO(w.code)[1]} ${weatherLine(w)} (서울 기준)` : "앗, 지금은 날씨를 못 가져왔어요. 창밖을 한번 볼까요? 🪟");
    }
    // 4) 수수께끼 · 농담 (또는 제안에 "응")
    if (QUIZ_INTENT.test(t) || (wasOffer && YES.test(t))) return askQuiz();
    // 5) 그 밖의 대화: 공감 + 되묻기
    const r = chatReply(t);
    if (/수수께끼 낼까요\?$/.test(r)) offer.current = true;
    say(r);
  }

  return (
    <section className="voice-screen voice-home" aria-label="메인 홈" data-phase={voice.phase}>
      <h1 className="sr-only">오늘의 할 일</h1>
      {[0, 1].map((i) => {
        const item = cards[i];
        const label = item && i === 0 && item.text === "당뇨약 먹기" ? "당뇨약" : item?.text;
        const clock = item && String(item.h) + ":" + pad(item.m);
        const state = item?.done ? "완료" : "대기";
        const matches = i === 0
          ? clock === "9:00" && label === "당뇨약" && item.done
          : clock === "10:20" && label === "연속극" && !item.done;
        return (
          <article key={i} className="voice-position voice-card"
            style={voiceBox(i === 0 ? 28 : 183, 138, 149, 74)}
            data-changed={!matches} aria-label={item ? clock + " " + label + " " + state : "예정된 일이 없어요"}>
            {!matches && (item ? <><strong>{clock}</strong><span>{label} │ {state}</span></> : <span>예정된 일이 없어요</span>)}
          </article>
        );
      })}

const dayKey = (off) => { const d = new Date(); d.setDate(d.getDate() + off); return keyOf(d); };
const buildTodos = () => [
  { id: 1, text: "당뇨약 먹기", dateKey: dayKey(0), h: 9, m: 0, pm: false, done: true },
  { id: 2, text: "연속극", dateKey: dayKey(0), h: 10, m: 20, pm: false, done: false },
  { id: 3, text: "경로당 가기", dateKey: dayKey(0), h: 1, m: 0, pm: true, done: false },
  { id: 4, text: "당뇨약 먹기", dateKey: dayKey(0), h: 6, m: 0, pm: true, done: false },
  { id: 5, text: "내과 정기검진", dateKey: dayKey(3), h: 10, m: 0, pm: false, done: false },
];
function App() {
  const [todos, setTodos] = useState(buildTodos);
  const [toastMsg, setToastMsg] = useState(null);
  const [weather, setWeather] = useState(null);
  const toastTimer = useRef(null);
  useEffect(() => { fetchWeather().then(setWeather); }, []);
  useEffect(() => () => clearTimeout(toastTimer.current), []);

  const toast = (message) => {
    setToastMsg(message);
    clearTimeout(toastTimer.current);
    toastTimer.current = setTimeout(() => setToastMsg(null), 2800);
  };
  const addTodo = (schedule) => {
    const { title, dateKey, h, m, pm } = schedule;
    setTodos((items) => [...items, { id: Date.now() + Math.random(), text: title, dateKey, h, m, pm, done: false }]);
  };
  const deleteTodo = (id) => {
    setTodos((items) => items.filter((item) => item.id !== id));
    toast("일정을 삭제했어요");
  };

  return (
    <div className="min-h-screen flex justify-center items-center md:py-6" style={{ background: "#eef1ef", fontFamily: "'Pretendard','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif", fontSize: 18 }}>
      <div className="voice-frame" style={{ background: CREAM }}>
        <Main todos={todos} deleteTodo={deleteTodo} addTodo={addTodo} toast={toast} weather={weather} />
        {toastMsg && <div className="absolute left-5 right-5 top-24 z-[60] rounded-2xl px-4 py-3 text-center text-[19px] font-bold text-white" style={{ background: "rgba(51,38,28,.94)" }} role="status">{toastMsg}</div>}
      </div>
    </div>
  );
}


createRoot(document.getElementById("root")).render(<App />);
</script>
