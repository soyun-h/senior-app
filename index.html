/* ═════════ 음성 인식 · 일정 해석 ═════════ */
const SpeechRec = typeof window !== "undefined" ? window.SpeechRecognition || window.webkitSpeechRecognition : null;

/* 한 번 듣기. 브라우저 음성 인식이 되면 실제 음성을, 안 되면(권한 거부·미지원) 시뮬레이션 문장을 사용 */
function listenOnce(fallback, done) {
  let finished = false;
  const fin = (t) => { if (finished) return; finished = true; done(t); };
  const sim = () => setTimeout(() => fin(fallback), 1800);
  if (!SpeechRec) { sim(); return; }
  try {
    const r = new SpeechRec();
    r.lang = "ko-KR"; r.interimResults = false; r.maxAlternatives = 1;
    let heard = false;
    r.onaudiostart = () => { heard = true; };
    r.onresult = (e) => fin(e.results[0][0].transcript);
    r.onerror = (e) => { if (e.error === "no-speech") fin(""); else sim(); };
    r.onend = () => { if (heard) fin(""); else sim(); };
    r.start();
  } catch { sim(); }
}

const HOUR_WORDS = { 한: 1, 두: 2, 세: 3, 네: 4, 다섯: 5, 여섯: 6, 일곱: 7, 여덟: 8, 아홉: 9, 열한: 11, 열두: 12, 열: 10 };
const todayKeyNow = () => keyOf(new Date());
const dateLabel = (k) => {
  const t = new Date(todayKeyNow()), d = new Date(k);
  const diff = Math.round((d - t) / 86400000);
  if (diff === 0) return "오늘";
  if (diff === 1) return "내일";
  if (diff === 2) return "모레";
  return `${d.getMonth() + 1}월 ${d.getDate()}일(${"일월화수목금토"[d.getDay()]})`;
};
const timeText = (x) => `${x.pm ? "오후" : "오전"} ${x.h}:${pad(x.m)}`;
const spokenTime = (x) => `${x.pm ? "오후" : "오전"} ${x.h}시${x.m ? ` ${x.m}분` : ""}`;
const tmin = (x) => ((x.h % 12) + (x.pm ? 12 : 0)) * 60 + x.m;
const timeLabel = (d) => `${d.getHours() < 12 ? "오전" : "오후"} ${d.getHours() % 12 || 12}:${pad(d.getMinutes())}`;

/* "오후 3시", "열두 시", "6시 반" → { h, m, pm, raw } */
function readTime(str) {
  const tm = str.match(/(오전|오후|아침|점심|저녁|밤|새벽)?\s*(\d{1,2}|열한|열두|열|한|두|세|네|다섯|여섯|일곱|여덟|아홉)\s*시\s*(반|\d{1,2}\s*분)?/);
  if (!tm) return null;
  const hr = /^\d/.test(tm[2]) ? +tm[2] : HOUR_WORDS[tm[2]];
  const m = tm[3] === "반" ? 30 : tm[3] ? parseInt(tm[3], 10) : 0;
  const ap = tm[1];
  let h, pm;
  if (hr > 12) { pm = true; h = hr - 12; }
  else if (hr === 0) { pm = false; h = 12; }
  else { h = hr; pm = ap && /오전|아침|새벽/.test(ap) ? false : ap ? true : hr === 12 || hr <= 6; }
  return { h, m, pm: !!pm, raw: tm[0] };
}

/* "경로당 가기 일정 지워줘" → 지울 일정 찾기: { kind: "none" | "one" | "many", todo?, list? } */
const DELETE_INTENT = /(지워|지우|삭제|취소해|취소 해|취소할|빼\s?줘|빼\s?주|없애)/;
function findTodoToDelete(raw, todos) {
  const tm = readTime(raw);
  const words = raw.replace(/\d{1,2}\s*월\s*\d{1,2}\s*일/g, " ").replace(tm ? tm.raw : "", " ")
    .replace(/(지워|지우|삭제|취소|빼|없애|줘|주세요|해줘|해 줘|해주세요|좀|일정|할 일|할일|오늘|내일|모레|을|를|은|는|이|가|도|에서|에)/g, " ")
    .split(/\s+/).map((w) => w.trim()).filter((w) => w.length >= 2);
  const ALIAS = { 병원: ["검진", "진료", "내과", "치과", "병원"], 장보기: ["사기", "장"], 약: ["약"] };
  const all = words.flatMap((w) => [w, ...(ALIAS[w] || [])]);
  let c = todos.filter((x) => all.some((w) => x.text.replace(/\s/g, "").includes(w)));
  if (!c.length) return { kind: "none" };
  if (tm) { const byTime = c.filter((x) => x.h === tm.h && x.m === tm.m && x.pm === tm.pm); if (byTime.length) c = byTime; }
  return c.length === 1 ? { kind: "one", todo: c[0] } : { kind: "many", list: c };
}

/* "10월 12일 오후 3시에 친구들과 모임이 있어" → { dateKey, h, m, pm, title } */
function parseSchedule(raw) {
  let rest = raw.replace(/\s+/g, " ").trim();
  const now = new Date();
  let date = null, m;
  if ((m = rest.match(/(\d{1,2})\s*월\s*(\d{1,2})\s*일/))) {
    date = new Date(now.getFullYear(), +m[1] - 1, +m[2]);
    if (keyOf(date) < keyOf(now)) date.setFullYear(date.getFullYear() + 1);
    rest = rest.replace(m[0], " ");
  } else if ((m = rest.match(/(오늘|내일|모레|글피)/))) {
    date = new Date(now); date.setDate(now.getDate() + { 오늘: 0, 내일: 1, 모레: 2, 글피: 3 }[m[1]]);
    rest = rest.replace(m[0], " ");
  } else if ((m = rest.match(/(이번\s*주|다음\s*주)?\s*([일월화수목금토])요일/))) {
    const ti = (("일월화수목금토".indexOf(m[2])) + 6) % 7, mon = new Date(now); mon.setDate(now.getDate() - monIdx(now));
    date = new Date(mon);
    if (m[1] && /다음/.test(m[1])) date.setDate(mon.getDate() + 7 + ti);
    else if (m[1]) date.setDate(mon.getDate() + ti);
    else { let diff = (ti - monIdx(now) + 7) % 7; date.setTime(now.getTime()); date.setDate(now.getDate() + (diff === 0 ? 7 : diff)); }
    rest = rest.replace(m[0], " ");
  }
  let h = 9, mi = 0, pm = false, noTime = true;
  const tm = readTime(rest);
  if (tm) { noTime = false; ({ h, m: mi, pm } = tm); rest = rest.replace(tm.raw, " "); }
  const intent = /(있|약속|모임|만나|가야|가기|예약|검진|병원|행사|잔치|생신|가요|간다|갈|해야|오기로|오는)/.test(raw);
  if ((!date && noTime) || !intent) return null;
  let title = rest.replace(/\s+/g, " ").trim().replace(/^(에는|에|은|는|부터|까지)\s*/, "");
  title = title.replace(/[.!?~]+$/g, "").replace(/\s*(이|가|은|는)?\s*(있어요?|있단다|있다|있네|있대|있거든|있어서|있습니다|잡혔어요?|잡혀 있어요?|예정이야|예정이에요|예정입니다)$/, "").trim();
  return { dateKey: keyOf(date || now), h, m: mi, pm, title: title || "새 일정", noTime };
}

const rainy = (code, pop) => (code >= 51 && code <= 67) || (code >= 80 && code <= 99) || pop >= 60;

/* 오늘·내일 날씨 (Open-Meteo, 서울 기준). 불러오지 못하면 null */
async function fetchWeather() {
  try {
    const ctrl = new AbortController(); const to = setTimeout(() => ctrl.abort(), 5000);
    const r = await fetch("https://api.open-meteo.com/v1/forecast?latitude=37.5665&longitude=126.978&current=temperature_2m,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&forecast_days=2&timezone=Asia%2FSeoul", { signal: ctrl.signal });
    clearTimeout(to);
    const j = await r.json();
    return {
      temp: Math.round(j.current.temperature_2m), code: j.current.weather_code,
      hi: Math.round(j.daily.temperature_2m_max[0]), lo: Math.round(j.daily.temperature_2m_min[0]), pop: j.daily.precipitation_probability_max[0],
      tCode: j.daily.weather_code[1], tHi: Math.round(j.daily.temperature_2m_max[1]), tLo: Math.round(j.daily.temperature_2m_min[1]), tPop: j.daily.precipitation_probability_max[1],
    };
  } catch { return null; }
}
const tipFor = (code, pop, t) => (rainy(code, pop) ? "우산 꼭 챙기세요! ☂️" : t <= 5 ? "많이 추워요. 따뜻하게 입으세요! 🧣" : t >= 28 ? "더워요. 물 자주 드세요! 💧" : t <= 12 ? "쌀쌀하니 겉옷 챙기세요!" : "산책하기 딱 좋은 날씨예요! 🚶");

const tomorrowLine = (w) => { const [d] = WMO(w.tCode); return `내일은 ${d}, 최고 ${w.tHi}도예요. ${tipFor(w.tCode, w.tPop, w.tHi)}`; };

function Carousel({ value, onChange, look, current }) {
  const ref = useRef(null);
  const idx = CHARS.findIndex((c) => c.id === value);
  const step = () => { const k = ref.current.children; return k.length > 1 ? k[1].offsetLeft - k[0].offsetLeft : k[0].offsetWidth; };
  useEffect(() => { ref.current.scrollTo({ left: idx * step() }); }, []);
  const onScroll = () => {
    const i = Math.max(0, Math.min(CHARS.length - 1, Math.round(ref.current.scrollLeft / step())));
    if (CHARS[i].id !== value) onChange(CHARS[i].id);
  };
  const to = (i) => ref.current.scrollTo({ left: Math.max(0, Math.min(CHARS.length - 1, i)) * step(), behavior: "smooth" });
  return (
    <div>
      <div className="flex items-center justify-between px-3">
        <button onClick={() => to(idx - 1)} disabled={idx === 0} aria-label="이전 캐릭터" className="w-[52px] h-[52px] rounded-full grid place-items-center disabled:opacity-25" style={{ background: SAND }}><ChevronLeft size={30} color={INK} /></button>
        <span className="text-[26px] font-extrabold" style={{ color: ORANGE }}>&lt; {value} &gt;</span>
        <button onClick={() => to(idx + 1)} disabled={idx === CHARS.length - 1} aria-label="다음 캐릭터" className="w-[52px] h-[52px] rounded-full grid place-items-center disabled:opacity-25" style={{ background: SAND }}><ChevronRight size={30} color={INK} /></button>
      </div>
      <div ref={ref} onScroll={onScroll} className="d-noscroll flex gap-4 overflow-x-auto mt-2 py-2" style={{ scrollSnapType: "x mandatory", paddingLeft: "15%", paddingRight: "15%" }}>
        {CHARS.map((c, i) => {
          const on = i === idx;
          return (
            <button key={c.id} onClick={() => to(i)} aria-label={`${c.id} 선택`} aria-pressed={on} className="shrink-0 w-[70%] rounded-[28px] flex flex-col items-center justify-end pb-4 transition-all duration-300"
              style={{ scrollSnapAlign: "center", height: 330, background: on ? PEACH : "#F4EDE4", border: `4px solid ${on ? ORANGE : "transparent"}`, transform: on ? "scale(1)" : "scale(.88)", opacity: on ? 1 : 0.6 }}>
              <Character gender={c.id} look={c.id === current ? look : c.look} size={190} />
              <span className="text-[24px] font-extrabold mt-1" style={{ color: INK }}>{c.id}</span>
              <span className="text-[18px] font-medium px-3 text-center" style={{ color: SUB, wordBreak: "keep-all" }}>{c.desc}</span>
            </button>
          );
        })}
      </div>
      <div className="flex justify-center gap-2 mt-2" aria-hidden="true">
        {CHARS.map((c, i) => <span key={c.id} className="h-[10px] rounded-full transition-all" style={{ width: i === idx ? 28 : 10, background: i === idx ? ORANGE : "#DCCBB8" }} />)}
      </div>
    </div>
  );
}

/* 왼쪽으로 밀면 삭제 아이콘이 나타나는 행 (마우스·터치 모두) */
function SwipeRow({ open, onOpen, onClose, onDelete, label, children }) {
  const W = 88;
  const [drag, setDrag] = useState(null);
  const st = useRef({ x: 0, base: 0, down: false, moved: false });
  const x = drag !== null ? drag : open ? -W : 0;
  const down = (e) => { st.current = { x: e.clientX, base: open ? -W : 0, down: true, moved: false }; };
  const move = (e) => {
    const s = st.current; if (!s.down) return;
    const dx = e.clientX - s.x;
    if (!s.moved && Math.abs(dx) > 8) { s.moved = true; try { e.currentTarget.setPointerCapture(e.pointerId); } catch {} }
    if (s.moved) setDrag(Math.max(-W, Math.min(0, s.base + dx)));
  };
  const up = () => {
    const s = st.current; if (!s.down) return;
    s.down = false;
    if (s.moved) { (drag !== null && drag < -W / 2) ? onOpen() : onClose(); setDrag(null); }
  };
  const clickCapture = (e) => {
    if (st.current.moved) { e.stopPropagation(); e.preventDefault(); st.current.moved = false; return; }
    if (open) { e.stopPropagation(); e.preventDefault(); onClose(); }
  };
  return (
    <div className="relative rounded-2xl overflow-hidden" style={{ touchAction: "pan-y" }}>
      <button onClick={onDelete} tabIndex={open ? 0 : -1} aria-label={`${label} 일정 삭제`} className="absolute right-0 top-0 bottom-0 grid place-items-center text-white" style={{ width: W, background: "#D94B3B" }}>
        <Trash2 size={32} />
      </button>
      <div onPointerDown={down} onPointerMove={move} onPointerUp={up} onPointerCancel={up} onClickCapture={clickCapture}
        style={{ transform: `translateX(${x}px)`, transition: drag === null ? "transform .22s ease" : "none" }}>
        {children}
      </div>
    </div>
  );
}

/* ═════════ 메인 ═════════ */
function Main({ s }) {
  const { gender, look, points, todos, user, tut, setTut, go, toggleTodo, deleteTodo, addTodo, toast, weather } = s;
  const [mode, setMode] = useState("idle"); // idle | listening | speaking
  const [speech, setSpeech] = useState(null);
  const [typing, setTyping] = useState(false);
  const [text, setText] = useState("");
  const [openId, setOpenId] = useState(null); // 왼쪽으로 밀어 삭제 버튼이 열린 일정
  const sp = useRef([]); const sim = useRef(0);
  const quiz = useRef(null);      // 낸 수수께끼 (답을 기다리는 중)
  const quizIdx = useRef(Math.floor(Math.random() * QUIZ.length));
  const offer = useRef(false);    // "수수께끼 낼까요?" 제안 후 대답 기다리는 중
  const lastTalk = useRef(Date.now());
  const live = useRef({});
  const greeted = useRef(false);
  useEffect(() => () => sp.current.forEach(clearTimeout), []);

  const todayKey = keyOf(new Date());
  const todayItems = todos.filter((t) => t.dateKey === todayKey).sort((a, b) => tmin(a) - tmin(b));
  const upcoming = todos.filter((t) => t.dateKey > todayKey).sort((a, b) => (a.dateKey === b.dateKey ? tmin(a) - tmin(b) : a.dateKey < b.dateKey ? -1 : 1));
  const doneCount = todayItems.filter((t) => t.done).length;
  const allDone = todayItems.length > 0 && doneCount === todayItems.length;
  const title = mode === "listening" ? "듣고 있어요..." : speech || (allDone ? "오늘 할 일을 모두 마쳤어요!" : `${user.name || "어르신"}님, 안녕하세요!`);

  const say = (msg) => {
    sp.current.forEach(clearTimeout);
    setSpeech(msg); setMode("speaking");
    sp.current = [setTimeout(() => setMode("idle"), Math.min(7000, 2200 + msg.length * 70)), setTimeout(() => setSpeech(null), Math.max(9000, msg.length * 220))];
  };
  const askQuiz = () => {
    const q = QUIZ[quizIdx.current++ % QUIZ.length];
    quiz.current = q; offer.current = false;
    say(`수수께끼 나갑니다~ ${q.q} 맞혀 보세요! 🤔`);
  };
  const handle = async (raw) => {
    const t = (raw || "").trim();
    lastTalk.current = Date.now();
    if (!t) return say("잘 못 들었어요~ 다시 한 번만 말씀해 주세요 🥺");
    const wasOffer = offer.current; offer.current = false;

    // 1) 수수께끼 정답 맞히기
    if (quiz.current) {
      const q = quiz.current;
      const isOther = DELETE_INTENT.test(t) || WEATHER_INTENT.test(t) || parseSchedule(t);
      if (!isOther) {
        quiz.current = null; offer.current = true;
        if (q.keys.some((k) => t.replace(/\s/g, "").includes(k.replace(/\s/g, "")))) return say(`딩동댕~! 정답은 '${q.a}'예요 👏 척척박사시네요! 하나 더 낼까요?`);
        if (/모르|몰라|힌트|포기|글쎄/.test(t)) return say(`정답은 '${q.a}'예요! ㅎㅎ 재밌죠? 하나 더 낼까요?`);
        return say(`땡~! 정답은 '${q.a}'예요 ㅎㅎ 아깝다~ 하나 더 낼까요?`);
      }
      quiz.current = null;
    }
    // 2) 일정 삭제 · 추가
    if (DELETE_INTENT.test(t)) {
      const r = findTodoToDelete(t, todos);
      if (r.kind === "one") { deleteTodo(r.todo.id); return say(`${dateLabel(r.todo.dateKey)} ${spokenTime(r.todo)} '${r.todo.text}' 일정을 삭제했어요.`); }
      if (r.kind === "many") return say(`'${r.list[0].text}' 일정이 ${r.list.length}개예요. 시간도 같이 말씀해 주세요. 예) ${spokenTime(r.list[0])} ${r.list[0].text} 지워줘`);
      return say("어떤 일정인지 못 찾았어요. 일정 이름을 같이 말씀해 주세요.");
    }
    const sc = parseSchedule(t);
    if (sc) {
      addTodo(sc, "voice");
      say(`${dateLabel(sc.dateKey)} ${spokenTime(sc)}에 '${sc.title}' 일정을 추가했어요!${sc.noTime ? " 시간은 오전 9시로 해 뒀어요." : ""} 그날 기대되시죠? 😊`);
      toast("📅 일정에 자동으로 추가했어요");
      return;
    }
    // 3) 날씨
    if (WEATHER_INTENT.test(t)) {
      const w = weather || (say("날씨를 알아볼게요~ 잠시만요 ⏳"), await fetchWeather());
      return say(w ? `${WMO(w.code)[1]} ${weatherLine(w)} (서울 기준)` : "앗, 지금은 날씨를 못 가져왔어요. 창밖을 한번 볼까요? 🪟");
    }
    // 4) 수수께끼 · 농담 (또는 제안에 "응")
    if (QUIZ_INTENT.test(t) || (wasOffer && YES.test(t))) return askQuiz();
    // 5) 그 밖의 대화: 공감 + 되묻기
    const r = chatReply(t);
    if (/수수께끼 낼까요\?$/.test(r)) offer.current = true;
    say(r);
  };
  const fallbackPhrase = () => {
    const n = sim.current++;
    if (n % 7 === 0) { const d = new Date(); d.setDate(d.getDate() + 5); return `${d.getMonth() + 1}월 ${d.getDate()}일 오후 3시에 친구들과 모임이 있어`; }
    return ["무릎이 좀 쑤시는구나", "경로당 가기 일정 지워줘", "오늘 날씨 어때?", "수수께끼 내줘", "카놀라유", "심심하구나"][(n - 1) % 6];
  };
  const mic = () => {
    if (tut === 2) setTut(null);
    if (mode !== "idle") return;
    lastTalk.current = Date.now();
    sp.current.forEach(clearTimeout); setSpeech(null); setMode("listening");
    listenOnce(fallbackPhrase(), (t) => { setMode("idle"); handle(t); });
  };
  live.current = { mode, speech, typing, say, name: user.name || "어르신" };
  // 가만히 있으면 캐릭터가 먼저 애교 섞어 말을 걸어요
  useEffect(() => {
    if (tut) return;
    let i = 0;
    const id = setInterval(() => {
      const L = live.current;
      if (L.mode !== "idle" || L.speech || L.typing || Date.now() - lastTalk.current < 25000) return;
      const line = IDLE_LINES(L.name)[i++ % 6];
      if (/수수께끼/.test(line)) offer.current = true;
      L.say(line);
    }, 30000);
    return () => clearInterval(id);
  }, [tut]);
  // 들어오면 오늘 날씨를 먼저 알려줘요
  useEffect(() => {
    if (tut || greeted.current || !weather) return;
    greeted.current = true;
    const id = setTimeout(() => live.current.say(`${live.current.name}님, 좋은 하루예요! ${WMO(weather.code)[1]} ${weatherLine(weather)}`), 900);
    return () => clearTimeout(id);
  }, [tut, weather]);

  const sendText = () => { const t = text.trim(); if (!t) return; setText(""); setTyping(false); handle(t); };

  const Card = ({ t, future }) => (
    <SwipeRow open={openId === t.id} onOpen={() => setOpenId(t.id)} onClose={() => setOpenId(null)} onDelete={() => { setOpenId(null); deleteTodo(t.id); }} label={t.text}>
      <button onClick={() => !future && toggleTodo(t.id)} disabled={future} aria-pressed={t.done}
        className="w-full min-h-[72px] bg-white rounded-2xl pl-4 pr-3 flex items-center justify-between gap-3 text-left disabled:active:scale-100 select-none">
        <span>
          <span className="block text-[21px] font-extrabold leading-snug" style={{ color: t.done ? "#A89787" : INK, textDecoration: t.done ? "line-through" : "none" }}>{t.text}</span>
          <span className="block text-[18px] font-medium" style={{ color: SUB }}>{future ? `${dateLabel(t.dateKey)} · ` : ""}{timeText(t)}</span>
        </span>
        <span className="w-[46px] h-[46px] rounded-xl grid place-items-center shrink-0" style={{ background: t.done ? SAGE_DEEP : SAND }}>
          {t.done ? <Check size={30} color="#fff" strokeWidth={3} /> : future ? <Calendar size={26} color="#B4A190" /> : null}
        </span>
      </button>
    </SwipeRow>
  );

  return (
    <div className="h-full flex flex-col relative overflow-hidden" style={{ background: `linear-gradient(180deg, ${CREAM} 0%, #FFEBD7 100%)` }}>
      {/* 상단: 말풍선 타이틀 · 포인트 · 메뉴 */}
      <div className="flex items-start justify-between px-6 pt-12 shrink-0">
        <div className="flex-1 pr-3">
          <h1 className={`${title.length > 46 ? "text-[21px] leading-[1.3]" : title.length > 24 ? "text-[24px] leading-[1.25]" : "text-[27px] leading-[1.25]"} font-extrabold`} style={{ color: INK, wordBreak: "keep-all" }} aria-live="polite">{title}</h1>
          <div className="mt-1 flex items-center gap-2 flex-wrap">
            <p className="inline-flex items-center gap-1 text-[20px] font-bold rounded-full px-3 py-0.5" style={{ background: "#FFE9B8", color: "#8A4B14" }}><Star size={18} fill="currentColor" />{points.toLocaleString()} p</p>
            {weather && <p className="inline-flex items-center gap-1 text-[20px] font-bold rounded-full px-3 py-0.5 bg-white" style={{ color: INK }}>{WMO(weather.code)[1]} {weather.temp}°</p>}
          </div>
        </div>
        <button onClick={() => go("settings")} aria-label="메뉴" className="w-[52px] h-[52px] rounded-2xl bg-white grid place-items-center shadow-md shrink-0"><Menu size={30} color={INK} /></button>
      </div>

      {/* 스크롤 영역: 캐릭터 + 할 일 (음성 버튼은 아래에 고정) */}
      <div className="flex-1 min-h-0 overflow-y-auto d-noscroll pb-[210px]">
        <div className="flex justify-center pt-1 relative z-0">
          <button onClick={() => go("customize")} aria-label="캐릭터 꾸미기"><Character gender={gender} look={look} speaking={mode === "speaking"} listening={mode === "listening"} size={215} /></button>
        </div>
        <div className="mx-4 -mt-9 relative z-10 rounded-3xl p-3 space-y-2" style={{ background: "rgba(94,127,90,.95)" }}>
          <p className="px-1 text-[20px] font-extrabold text-white">오늘의 할 일 <span className="opacity-90">{doneCount}/{todayItems.length}</span></p>
          <p className="px-1 -mt-1 pb-1 text-[18px] text-white/90">← 왼쪽으로 밀면 삭제 · "○○ 지워줘"라고 말해도 돼요</p>
          {todayItems.length === 0 && <p className="px-1 pb-1 text-[19px] text-white/90">오늘 예정된 일이 없어요.</p>}
          {todayItems.map((t) => <Card key={t.id} t={t} />)}
          {upcoming.length > 0 && <p className="px-1 pt-2 text-[20px] font-extrabold text-white">다가오는 일정</p>}
          {upcoming.map((t) => <Card key={t.id} t={t} future />)}
        </div>
      </div>

      {/* 음성 버튼: 화면 하단에 고정 */}
      <div className="absolute left-0 right-0 bottom-0 flex flex-col items-center pb-8 pt-10" style={{ zIndex: tut === 2 ? 40 : 20, background: tut === 2 ? "transparent" : "linear-gradient(180deg, rgba(255,235,215,0) 0%, #FFEBD7 45%)" }}>
        <button onClick={() => setTyping(true)} aria-label="글자로 말하기" className="absolute left-6 bottom-[62px] w-[60px] h-[60px] rounded-full bg-white grid place-items-center shadow-md"><Keyboard size={30} color={INK} /></button>
        <button onClick={mic} aria-label="음성으로 말하기" className={`w-[124px] h-[124px] rounded-full grid place-items-center active:scale-95 transition ${mode === "listening" ? "d-ring" : ""}`}
          style={{ background: mode === "listening" ? "#D94B3B" : tut === 2 ? "#E6E0D8" : PEACH, boxShadow: "0 10px 24px rgba(232,116,59,.3)" }}>
          <Mic size={64} color={mode === "listening" ? "#fff" : INK} strokeWidth={2.4} />
        </button>
        <p className="mt-2 text-[19px] font-bold" style={{ color: tut === 2 ? "#fff" : SUB }}>{mode === "listening" ? "말씀하세요" : "눌러서 말해 보세요"}</p>
      </div>

      {/* 글자로 말하기 (음성이 어려울 때) */}
      {typing && (
        <div className="absolute inset-0 z-40 bg-black/50 flex items-end" onClick={() => setTyping(false)}>
          <div className="w-full rounded-t-[32px] p-5 pb-8 d-slide" style={{ background: CREAM }} onClick={(e) => e.stopPropagation()}>
            <p className="text-[22px] font-extrabold mb-1" style={{ color: INK }}>글자로 말해 보세요</p>
            <p className="text-[18px] mb-2" style={{ color: SUB }}>예) 10월 12일 오후 3시에 친구들과 모임이 있어</p>
            <div className="flex flex-wrap gap-2 mb-3">{["오늘 날씨 어때?", "수수께끼 내줘", "심심해", "안녕"].map((c) => <button key={c} onClick={() => { setTyping(false); handle(c); }} className="min-h-[52px] px-4 rounded-full bg-white text-[19px] font-bold" style={{ border: `2px solid ${PEACH}`, color: INK }}>{c}</button>)}</div>
            <input autoFocus value={text} onChange={(e) => setText(e.target.value)} onKeyDown={(e) => e.key === "Enter" && sendText()} className={inputCls} placeholder="여기에 입력하세요" />
            <div className="grid grid-cols-2 gap-3 mt-4"><Pill onClick={sendText} disabled={!text.trim()}>보내기</Pill><Pill variant="sub" onClick={() => setTyping(false)}>취소</Pill></div>
          </div>
        </div>
      )}

      {/* 사용법 설명 오버레이 */}
      {tut === 1 && (
        <div className="absolute inset-0 z-30 bg-black/65 cursor-pointer" onClick={() => setTut(2)}>
          <div className="absolute left-0 right-0 top-[205px] flex justify-center"><div className="w-[200px] h-[200px] rounded-[100px]" style={{ border: "4px dashed #fff" }} /></div>
          <Hand size={64} color="#fff" className="absolute left-1/2 top-[330px] ml-[-10px] d-tap" />
          <p className="absolute left-0 right-0 top-[105px] text-center text-white text-[28px] font-extrabold leading-snug">캐릭터를 누르면<br />의상을 꾸밀 수 있어요</p>
          <p className="absolute bottom-10 left-0 right-0 text-center text-white/90 text-[19px] font-bold">화면을 눌러 다음으로</p>
        </div>
      )}
      {tut === 2 && (
        <div className="absolute inset-0 z-30 bg-black/65">
          <button onClick={() => setTut(null)} aria-label="닫기" className="absolute top-12 right-5 w-[52px] h-[52px] grid place-items-center"><X size={38} color="#fff" /></button>
          <p className="absolute left-0 right-0 top-[105px] text-center text-white text-[28px] font-extrabold leading-snug">음성버튼을 눌러<br />말을 걸어보세요</p>
          <ArrowDown size={50} color="#fff" className="absolute left-1/2 ml-[-25px] bottom-[210px] d-tap" />
        </div>
      )}
    </div>
  );
}

/* ═════════ 캐릭터 꾸미기 ═════════ */
function Customize({ s }) {
  const { gender, look, setLook, owned, setOwned, points, setPoints, go, toast } = s;
  const [tab, setTab] = useState("hair");
  const [pv, setPv] = useState({});
  const view = { ...look, ...pv };
  const idx = pv[tab];
  const key = (i) => `${tab}-${i}`;
  const isOwned = (i) => owned.includes(key(i));
  let action = null;
  if (idx !== undefined && idx !== look[tab]) action = isOwned(idx) ? "입기" : `${PRICES[idx]}p로 사기`;
  else if (tab === "acc" && look.acc !== null && idx === look.acc) action = "벗기";

  const apply = () => {
    if (action === "벗기") { setLook({ ...look, acc: null }); setPv({ ...pv, acc: null }); toast("악세사리를 벗었어요"); return; }
    if (!isOwned(idx)) {
      if (points < PRICES[idx]) return toast("포인트가 부족해요. 일정을 마치면 포인트가 쌓여요!");
      setPoints(points - PRICES[idx]); setOwned([...owned, key(idx)]);
    }
    setLook({ ...look, [tab]: idx });
    const { [tab]: _, ...rest } = pv; setPv(rest);
    toast("멋지게 꾸몄어요! ✨");
  };

  const lookWith = (i) => ({ ...view, [tab]: i });
  return (
    <div className="h-full flex flex-col" style={{ background: CREAM }}>
      <div className="shrink-0 relative" style={{ background: PEACH, borderRadius: "0 0 32px 32px" }}>
        <div className="flex items-center justify-between px-5 pt-12">
          <button onClick={() => go("main")} aria-label="뒤로" className="w-[52px] h-[52px] rounded-2xl bg-white/70 grid place-items-center"><ArrowLeft size={28} color={INK} /></button>
          <h1 className="text-[26px] font-extrabold" style={{ color: INK }}>캐릭터 꾸미기</h1>
          <span className="w-[52px]" />
        </div>
        <p className="px-6 mt-1 text-[22px] font-extrabold" style={{ color: "#8A4B14" }}>{points.toLocaleString()} p</p>
        <div className="flex justify-center -mt-4 pb-1"><Character gender={gender} look={view} size={170} /></div>
      </div>
      <div className="grid grid-cols-3 gap-2 px-4 mt-4 shrink-0">
        {Object.entries(TAB_META).map(([k, v]) => (
          <button key={k} onClick={() => setTab(k)} className="h-[56px] rounded-2xl text-[20px] font-extrabold transition"
            style={{ background: tab === k ? ORANGE : SAND, color: tab === k ? "#fff" : INK }}>{tabLabel(k, gender)}</button>
        ))}
      </div>
      <div className="flex-1 overflow-y-auto px-4 pt-3 pb-28 grid grid-cols-3 gap-3 content-start">
        {PRICES.map((price, i) => {
          const sel = (idx !== undefined ? idx : look[tab]) === i;
          return (
            <button key={i} onClick={() => setPv({ ...pv, [tab]: i })} aria-pressed={sel} className="relative rounded-2xl overflow-hidden grid place-items-center active:scale-95 transition"
              style={{ height: 124, background: SAND, border: `4px solid ${sel ? ORANGE : "transparent"}` }}>
              <Character gender={gender} look={lookWith(i)} size={80} head />
              <span className="absolute bottom-1 right-2 text-[18px] font-extrabold" style={{ color: isOwned(i) ? SAGE_DEEP : INK }}>{isOwned(i) ? "보유" : `${price} p`}</span>
            </button>
          );
        })}
      </div>
      {action && (
        <div className="absolute left-0 right-0 bottom-0 p-4 pb-8 d-slide" style={{ background: "linear-gradient(180deg, transparent, #FFF8EE 40%)" }}>
          <Pill onClick={apply} className="w-full">{action}</Pill>
        </div>
      )}
    </div>
  );
}

/* ═════════ 설정 · 내 정보 ═════════ */
function Settings({ s }) {
  const { user, go, setLoggedOut } = s;
  const rows = [
    ["내 정보", () => go("myinfo")], ["캐릭터 변경", () => go("charChange")], null,
    ["시간 설정", () => go("times")], ["기록 (일기)", () => go("diary")], ["로그아웃", setLoggedOut], ["탈퇴", () => go("withdraw")],
  ];
  return (
    <div className="h-full flex flex-col" style={{ background: CREAM }}>

function Wheel({ value, onChange, min, max, label }) {
  const range = max - min + 1;
  const at = (r) => ((value - min + r + range * 3) % range) + min;
  const sizes = { "-2": ["text-[30px]", ".25"], "-1": ["text-[40px]", ".5"], "0": ["text-[64px]", "1"], "1": ["text-[40px]", ".5"], "2": ["text-[30px]", ".25"] };
  return (
    <div className="flex flex-col items-center w-[104px]">
      <button onClick={() => onChange(at(-1))} aria-label={`${label} 줄이기`} className="w-full h-[48px] grid place-items-center"><ChevronUp size={32} color={SUB} /></button>
      {[-2, -1, 0, 1, 2].map((r) => (
        <button key={r} onClick={() => onChange(at(r))} className={`w-full font-extrabold leading-[1.15] ${sizes[r][0]}`} style={{ opacity: sizes[r][1], color: INK, minHeight: r === 0 ? 76 : 44 }}>{pad(at(r))}</button>
      ))}
      <button onClick={() => onChange(at(1))} aria-label={`${label} 늘리기`} className="w-full h-[48px] grid place-items-center"><ChevronDown size={32} color={SUB} /></button>
    </div>
  );
}

const PROOF_MISSIONS = [
  { name: "당뇨약", time: "오전 9:00", message: "9시 당뇨약 복용을 완료했어요!", share: "오전 9:00 당뇨약 복용을 완료했어요!" },

  { name: "아들 방문", time: "오후 06:30" },
];

const PROOF_NOTES = [
  "오늘도 건강하게 챙기고 있다는 걸 전해주세요.",
  "약을 잘 드셨다는 소식이 가족에게는 큰 안심이 돼요.",
  "가족들이 오늘도 걱정 없이 지낼 수 있도록 알려주세요.",
  "오늘도 잘 지내고 있다는 반가운 소식을 보내보세요.",
];

function ProofCamera({ onPhoto, onClose, onResume }) {
  const video = useRef(null);
  const liveTrack = useRef(null);
  const active = useRef(false);
  const busy = useRef(false);
  const [facing, setFacing] = useState("environment");
  const [ready, setReady] = useState(false);
  const [torch, setTorch] = useState(false);
  const [message, setMessage] = useState("");
  const [cameraError, setCameraError] = useState(false);

  useEffect(() => {
    let cancelled = false;
    let stream;
    active.current = true;
    const preview = video.current;
    const fail = (error) => {
      if (cancelled) return;
      setReady(false);
      setCameraError(true);
      setMessage(error?.name === "NotAllowedError"
        ? "카메라 권한을 허용하거나 사진을 선택해 주세요."
        : "카메라를 열 수 없어요. 사진을 선택해 주세요.");
    };
    async function start() {
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: facing === "user" ? { exact: "user" } : { ideal: "environment" } },
          audio: false,
        });
        if (cancelled) {
          stream.getTracks().forEach((track) => track.stop());
          return;
        }
        const track = stream.getVideoTracks()[0];
        liveTrack.current = track;
        track.addEventListener("ended", fail, { once: true });
        preview.srcObject = stream;
        await preview.play();
        if (!cancelled) setReady(true);
      } catch (error) {
        stream?.getTracks().forEach((track) => track.stop());
        fail(error);
      }
    }
    start();
    return () => {
      cancelled = true;
      active.current = false;
      liveTrack.current = null;
      stream?.getTracks().forEach((track) => track.stop());
      preview.srcObject = null;
    };
  }, [facing]);

  const switchCamera = () => {
    if (busy.current) return;
    setReady(false);
    setTorch(false);
    setMessage("");
    setCameraError(false);
    setFacing((current) => current === "environment" ? "user" : "environment");
  };

  const toggleFlash = async () => {
    const track = liveTrack.current;
    if (!ready || !track?.getCapabilities?.().torch) {
      if (!cameraError) setMessage("이 카메라에서 플래시를 켤 수 없어요.");
      return;
    }
    try {
      await track.applyConstraints({ advanced: [{ torch: !torch }] });
      if (liveTrack.current !== track) return;
      setTorch(!!track.getSettings().torch);
      setMessage("");
    } catch {
      if (liveTrack.current === track) setMessage("플래시 설정을 바꿀 수 없어요.");
    }
  };

  const capture = async () => {
    if (busy.current) return;
    const source = video.current;
    if (!ready || !source.videoWidth) {
      if (!cameraError) setMessage("카메라가 준비되면 다시 눌러주세요.");
      return;
    }
    busy.current = true;
    try {
      const canvas = document.createElement("canvas");
      canvas.width = source.videoWidth;
      canvas.height = source.videoHeight;
      canvas.getContext("2d").drawImage(source, 0, 0);
      const image = await new Promise((resolve) => canvas.toBlob(resolve, "image/jpeg", 0.92));
      if (!image) throw new Error("Photo encoding failed");
      if (active.current) onPhoto(new File([image], "mission-proof.jpg", { type: image.type }));
    } catch {
      if (active.current) setMessage("사진을 찍지 못했어요. 다시 눌러주세요.");
    } finally {
      busy.current = false;
    }
  };

  const selectPhoto = async (event) => {
    const file = event.target.files[0];
    event.target.value = "";
    if (!file || busy.current) return;
    busy.current = true;
    const url = URL.createObjectURL(file);
    try {
      const image = new Image();
      image.src = url;
      await image.decode();
      if (active.current) onPhoto(file);
    } catch {
      if (active.current) setMessage("사진을 열 수 없어요. 다른 사진을 선택해 주세요.");
    } finally {
      URL.revokeObjectURL(url);
      busy.current = false;
    }
  };

  return (
    <div className="mission-camera">
      <video ref={video} autoPlay muted playsInline aria-label="카메라 실시간 미리보기" />
      <div className="mission-camera-tools">
        <button type="button" aria-label="카메라 전환" onClick={switchCamera}><SwitchCamera /></button>
        <button type="button" aria-label="플래시" aria-pressed={torch} onClick={toggleFlash}>{torch ? <Zap fill="currentColor" /> : <Zap />}</button>
        <button type="button" aria-label="닫기" onClick={onClose}><X /></button>
      </div>
      <h1>사진 인증 촬영</h1>
      <div className="mission-guides"><i /><i /><i /><i /><p>네모 안에 맞춰주세요</p></div>
      <div className="mission-camera-status">
        {message && <p role="status">{message}</p>}
        {!ready && <label className="mission-file">
          사진 선택
          <input type="file" accept="image/*" aria-label="사진 선택" onChange={selectPhoto} />
        </label>}
      </div>
      <button type="button" className="mission-shutter" aria-label="사진 촬영" onClick={capture}><span><Camera /></span></button>
      {onResume && <button type="button" className="mission-resume" onClick={onResume}>이전 사진 사용</button>}
    </div>
  );
}

function ProofBack({ onClick }) {
  return <button type="button" className="mission-back" aria-label="뒤로가기" onClick={onClick}><ChevronLeft /></button>;
}

function PhotoProof({ onConfirm, onCancel }) {
  const historyId = useId();
  const [step, setStep] = useState("camera");
  const [photo, setPhoto] = useState(null);
  const [photoUrl, setPhotoUrl] = useState("");
  const [selected, setSelected] = useState(null);
  const [note, setNote] = useState("");
  const [message, setMessage] = useState("");
  const [fallback, setFallback] = useState(false);
  const [sharing, setSharing] = useState(false);
  const confirmed = useRef(false);
  const mission = PROOF_MISSIONS[step === "complete" ? history.state?.missionIndex : selected];
  const shareText = mission?.share ?? (mission ? `${mission.time} ${mission.name} 완료했어요!` : "");

  useEffect(() => {
    if (!photo) return;
    const url = URL.createObjectURL(photo);
    setPhotoUrl(url);
    return () => URL.revokeObjectURL(url);
  }, [photo]);

  const showStep = (next) => {
    if (next === "complete") setNote(PROOF_NOTES[Math.floor(Math.random() * PROOF_NOTES.length)]);
    setMessage("");
    setFallback(false);
    setStep(next);
  };

  useEffect(() => {
    const navigate = ({ state }) => showStep(state?.photoProof === historyId ? state.step : "camera");
    window.addEventListener("popstate", navigate);
    return () => window.removeEventListener("popstate", navigate);
  }, [historyId]);

  const advance = (next) => {
    history.pushState({ ...history.state, photoProof: historyId, step: next, missionIndex: next === "complete" ? selected : null }, "");
    showStep(next);
  };
  const back = () => history.back();
  const receivePhoto = (file) => {
    setPhoto(file);
    advance("review");
  };

  const register = (event) => {
    event.preventDefault();
    if (!mission) {
      setMessage("인증할 미션을 한 가지 선택해 주세요.");
      document.querySelector(".mission-options input")?.focus();
      return;
    }
    if (!photo) return;
    if (!confirmed.current) {
      confirmed.current = true;
      onConfirm?.();
    }
    advance("complete");
  };

  const share = async () => {
    if (sharing) return;
    const data = { title: "미션 인증 완료", text: shareText, files: [photo] };
    setSharing(true);
    try {
      if (navigator.share && navigator.canShare?.(data)) {
        await navigator.share(data);
        return;
      }
      setFallback(true);
    } catch (error) {
      if (error.name !== "AbortError") setFallback(true);
    } finally {
      setSharing(false);
    }
  };

  const copyMessage = async () => {
    try {
      await navigator.clipboard.writeText(shareText);
      setMessage("인증 메시지를 복사했어요.");
    } catch {
      setMessage("아래 문구를 길게 누르거나 선택해 복사해 주세요.");
    }
  };

  return (
    <section className={`mission-proof mission-step-${step}`} aria-label="사진 인증">
      {step === "camera" && <ProofCamera onPhoto={receivePhoto} onClose={() => onCancel(confirmed.current)}
        onResume={photo ? () => advance("review") : null} />}
      {step === "review" && (
        <form className="mission-review" onSubmit={register}>
          <header><ProofBack onClick={back} /><h1>인증하기</h1></header>
          <div className="mission-preview">
            {photoUrl && <img src={photoUrl} alt="인증할 사진" />}
            <button type="button" className="mission-retake" onClick={back}><Camera />재촬영</button>
          </div>
          <fieldset className="mission-options">
            <legend><Check />무엇을 수행했나요?</legend>
            <div className="mission-rows">
              {PROOF_MISSIONS.map(({ name, time }, index) => (
                <label className="mission-option" key={name}>
                  <input type="radio" name="proof-mission" checked={selected === index}
                    onChange={() => { setSelected(index); setMessage(""); }} />
                  <span className="mission-radio"><Check /></span>
                  <strong>{name}</strong><span className="mission-time">{time}</span>
                </label>
              ))}
            </div>
          </fieldset>
          {message && <p className="mission-validation" role="alert">{message}</p>}
          <button type="submit" className="mission-register">등록하기</button>
        </form>
      )}
      {step === "complete" && mission && (
        <div className="mission-complete">

          <div className="mission-badge" aria-hidden="true"><i /></div>
          <div className="mission-stack">
            <span className="mission-sparkles" aria-hidden="true"><i /><i /><i /><i /><i /><i /></span>
            {photoUrl && <img src={photoUrl} alt="인증 완료 사진" />}
          </div>
          <h1>인증 완료!</h1>
          <p className="mission-completed-time">{mission.name} · {mission.time}</p>
          <section className="mission-family" aria-label="가족 공유">
            <h2>명숙(큰딸)님에게 공유해보아요</h2>
            <p>{note}</p>
            <button className="mission-share" type="button" onClick={share} disabled={sharing}>
              <span title={`${mission.name} ${mission.time}`}>{mission.message ?? shareText}</span><span><ArrowUp /></span>
            </button>
          </section>
          {fallback && <div className="mission-share-fallback">
            <p>사진을 저장하고 메시지를 복사해 가족에게 보내세요.</p>

              <a href={photoUrl} download={photo.name}>사진 저장</a>
              <button type="button" onClick={copyMessage}>메시지 복사</button>
              <button type="button" onClick={() => { setFallback(false); setMessage(""); }}>닫기</button>
            </div>
            <p role="status">{message}</p>
            <p>{shareText}</p>
          </div>}
        </div>
      )}
    </section>
  );
}

/* ═════════ 기록 (일기) = 자기 전 하루 마무리 대화 저장 ═════════ */
const MOODS = {
  good: { e: "😊", l: "기분 좋은 하루", bg: "#DDE9DA", c: "#2F4A2D" },
  soso: { e: "🙂", l: "평온한 하루", bg: "#FFE9B8", c: "#8A4B14" },
  bad: { e: "😔", l: "힘든 하루", bg: "#F6D2CB", c: "#8F2A1F" },
};
const moodOf = (t) => (/힘들|아프|외로|쓸쓸|우울|그저|피곤|슬프|깜빡|못/.test(t) ? "bad" : /좋|행복|즐거|기뻐|맛있|웃|잘/.test(t) ? "good" : "soso");

const WRAP_QS = [
  { q: (n) => `${n}님, 오늘 하루는 어떠셨어요? 기분은 어떠세요?`, chips: ["좋았어요 😊", "그저 그랬어요", "조금 힘들었어요"], sim: "오늘은 기분이 좋았단다" },
  { q: () => "오늘 누구를 만나거나 통화하셨어요?", chips: ["가족과 통화했어요", "친구를 만났어요", "아무도 안 만났어요"], sim: "딸이랑 통화했단다" },
  { q: () => "식사와 약은 잘 챙기셨어요?", chips: ["잘 챙겼어요", "약을 깜빡했어요"], sim: "약도 잘 챙겨 먹었단다" },
  { q: () => "오늘 기억하고 싶은 일이 있으세요?", chips: ["산책을 했어요", "맛있는 걸 먹었어요", "특별한 일은 없었어요"], sim: "경로당에서 윷놀이를 했단다" },
  { q: () => "내일은 어떤 하루를 보내실 건가요?", chips: ["내일 오전 10시에 병원에 가요", "친구를 만나요", "푹 쉴 거예요"], sim: "내일 오후 2시에 시장에 갈 거야" },
];
const wrapReply = (step, t) => {
  if (step === 0) return /힘들|아프|외로|우울|그저/.test(t) ? "많이 힘드셨겠어요. 이야기해 주셔서 고마워요. 제가 곁에 있을게요." : /좋|행복|즐거/.test(t) ? "좋은 하루셨다니 저도 정말 기뻐요!" : "그러셨군요. 평범한 하루도 소중하지요.";
  if (step === 1) return /가족|딸|아들|손주|전화/.test(t) ? "가족분 목소리를 들으면 힘이 나지요!" : /친구|경로당|만났/.test(t) ? "친구분들과 함께하셔서 즐거우셨겠어요." : "오늘은 조용한 하루셨네요. 내일은 제가 더 많이 이야기 들어 드릴게요.";
  if (step === 2) return /깜빡|못|안\s/.test(t) ? "약은 꼭 챙겨 드셔야 해요. 내일은 알람으로 꼭 알려 드릴게요." : "잘하셨어요! 건강이 제일이에요.";
  if (step === 3) return "소중한 기억이네요. 일기에 잘 적어 둘게요.";
  return "내일도 좋은 하루가 될 거예요.";
};

function DayWrap({ s }) {
  const { gender, look, user, addJournal, addTodo, go, toast, weather } = s;
  const [msgs, setMsgs] = useState([]);
  const [step, setStep] = useState(0);
  const [input, setInput] = useState("");
  const [busy, setBusy] = useState(true);
  const [done, setDone] = useState(false);
  const [speaking, setSpeaking] = useState(false);
  const [listening, setListening] = useState(false);
  const [typing, setTyping] = useState(false);
  const timers = useRef([]); const saved = useRef(false); const endRef = useRef(null);
  const later = (fn, ms) => { timers.current.push(setTimeout(fn, ms)); };
  useEffect(() => () => timers.current.forEach(clearTimeout), []);
  useEffect(() => { endRef.current?.scrollIntoView({ behavior: "smooth", block: "end" }); }, [msgs, listening]);

  const pushBot = (text) => { setMsgs((m) => [...m, { from: "bot", text }]); setSpeaking(true); later(() => setSpeaking(false), 1800); };
  useEffect(() => {
    later(() => pushBot("하루 마무리 시간이에요 🌙 오늘 이야기를 나눠 볼까요?"), 300);
    later(() => { pushBot(WRAP_QS[0].q(user.name || "어르신")); setBusy(false); }, 1700);
  }, []);

  const send = (raw) => {
    const t = (raw || "").trim();
    if (!t || busy || done) return;
    setInput(""); setMsgs((m) => [...m, { from: "user", text: t }]); setBusy(true);
    let extra = "";
    if (step === 4) {
      const sc = parseSchedule(t);
      if (sc) { addTodo(sc, "voice"); extra = ` ${dateLabel(sc.dateKey)} ${spokenTime(sc)}에 '${sc.title}' 일정도 추가해 둘게요!`; }
    }
    later(() => pushBot(wrapReply(step, t) + extra), 800);
    if (step + 1 < WRAP_QS.length) later(() => { pushBot(WRAP_QS[step + 1].q(user.name)); setStep(step + 1); setBusy(false); }, 2600);
    else {
      const q = QUIZ[Math.floor(Math.random() * QUIZ.length)];
      later(() => pushBot(`${weather ? tomorrowLine(weather) + " " : ""}자기 전에 웃음 한 스푼! 🥄 ${q.q} ...정답은 '${q.a}'! ㅎㅎ`), 2600);
      later(() => { pushBot("오늘도 정말 수고 많으셨어요. 이야기는 일기에 잘 저장해 둘게요. 내일 아침에도 목소리 꼭 들려주세요~ 기다릴게요 🥰 푹 주무세요, 좋은 꿈 꿔요 🌙"); setDone(true); setBusy(false); }, 5600);
    }
  };
  const mic = () => {
    if (busy || done || listening) return;
    setListening(true);
    listenOnce(WRAP_QS[step].sim, (t) => { setListening(false); if (t) send(t); else pushBot("잘 못 들었어요. 다시 한 번 말씀해 주세요."); });
  };
  const finish = () => {
    const users = msgs.filter((m) => m.from === "user");
    if (!saved.current && users.length) {
      saved.current = true;
      const now = new Date();
      addJournal({ id: Date.now(), dateKey: keyOf(now), time: timeLabel(now), mood: moodOf(users.map((u) => u.text).join(" ")), messages: msgs });
      toast(done ? "오늘의 이야기를 일기에 저장했어요 🌙" : "여기까지의 이야기를 일기에 저장했어요");
    }
    go("diary");
  };

  return (
    <div className="h-full flex flex-col" style={{ background: "linear-gradient(180deg,#FFF1E3,#F4E6F0)" }}>
      <Header title="하루 마무리" onBack={finish} />
      <div className="shrink-0 flex items-center gap-3 px-5 pb-2">
        <div className="w-[84px] h-[84px] rounded-full overflow-hidden grid place-items-center shrink-0" style={{ background: PEACH }}><Character gender={gender} look={look} speaking={speaking} size={74} head /></div>
        <p className="text-[19px] font-bold leading-snug" style={{ color: SUB }}>오늘 하루를 같이 돌아봐요.<br />이야기는 일기에 저장돼요.</p>
      </div>
      <div className="flex-1 overflow-y-auto px-4 py-2 space-y-3 d-noscroll">
        {msgs.map((m, i) => (
          <div key={i} className={`flex ${m.from === "user" ? "justify-end" : "justify-start"}`}>
            <div className="max-w-[86%] px-4 py-3 rounded-3xl text-[20px] leading-snug font-medium" style={m.from === "user" ? { background: "#FFE08A", color: INK, borderBottomRightRadius: 8 } : { background: "#fff", color: INK, border: "2px solid #FFD9BF", borderBottomLeftRadius: 8 }}>{m.text}</div>
          </div>
        ))}
        {busy && msgs.length > 0 && !done && <div className="text-[18px] font-bold pl-2" style={{ color: SUB }}>입력 중...</div>}
        {listening && <div className="flex items-center justify-center gap-2 text-[20px] font-bold py-2" style={{ color: ORANGE }}><span className="w-3 h-3 rounded-full bg-red-500 d-ring" /> 듣고 있어요... 말씀해 주세요</div>}
        <div ref={endRef} />
      </div>
      <div className="shrink-0 px-4 pb-8 pt-2">
        {done ? (
          <Pill onClick={finish} className="w-full">저장하고 잘 자요 🌙</Pill>
        ) : (
          <div className="relative flex flex-col items-center">
            {typing && (
              <div className="w-full flex gap-2 items-center mb-3">
                <input autoFocus value={input} onChange={(e) => setInput(e.target.value)} onKeyDown={(e) => e.key === "Enter" && send(input)} disabled={busy} placeholder="글자로 답하기" className="flex-1 min-w-0 h-[56px] rounded-2xl px-4 text-[20px] bg-white border-2 border-transparent focus:outline-none focus:border-[#E8743B] disabled:opacity-60" />
                <button onClick={() => send(input)} disabled={busy || !input.trim()} aria-label="보내기" className="w-[56px] h-[56px] rounded-full grid place-items-center shrink-0 disabled:opacity-40" style={{ background: ORANGE }}><Send size={26} color="#fff" /></button>
              </div>
            )}
            <button onClick={mic} disabled={busy && !listening} aria-label="음성으로 대답하기"
              className={`w-[136px] h-[136px] rounded-full grid place-items-center active:scale-95 transition disabled:opacity-45 ${listening ? "d-ring" : ""}`}
              style={{ background: listening ? "#D94B3B" : ORANGE, boxShadow: "0 10px 24px rgba(232,116,59,.35)" }}>
              <Mic size={72} color="#fff" strokeWidth={2.4} />
            </button>
            <p className="mt-2 text-[21px] font-extrabold" style={{ color: listening ? "#D94B3B" : INK }}>
              {listening ? "듣고 있어요... 말씀해 주세요" : busy ? "잠시만 기다려 주세요" : "눌러서 대답해 주세요"}
            </p>
            <button onClick={() => setTyping(!typing)} aria-label="글자로 답하기" className="absolute left-1 bottom-9 w-[60px] h-[60px] rounded-full bg-white grid place-items-center shadow-md"><Keyboard size={30} color={INK} /></button>
          </div>
        )}
      </div>
    </div>
  );
}

function Diary({ s }) {
  const { journal, deleteJournal, go } = s;
  const [confirmId, setConfirmId] = useState(null);
  const today = new Date();
  const week = Array.from({ length: 7 }, (_, i) => { const d = new Date(today); d.setDate(today.getDate() - monIdx(today) + i); return d; });
  const [sel, setSel] = useState(keyOf(today));
  const isToday = sel === keyOf(today);
  const d = new Date(sel);
  const entries = journal.filter((e) => e.dateKey === sel).sort((a, b) => b.id - a.id);
  const target = journal.find((e) => e.id === confirmId);
  return (
    <div className="h-full flex flex-col relative" style={{ background: CREAM }}>
      <Header title="기록 (일기)" onBack={() => go("settings")} />
      <div className="grid grid-cols-7 gap-1 px-3 mt-1 shrink-0">
        {week.map((w, i) => {
          const k = keyOf(w), on = k === sel, has = journal.some((e) => e.dateKey === k);
          return (
            <button key={k} onClick={() => setSel(k)} aria-pressed={on} className="rounded-2xl py-2 flex flex-col items-center gap-1 transition" style={{ background: on ? PEACH : "transparent", minHeight: 96 }}>
              <span className="text-[18px] font-bold" style={{ color: SUB }}>{DAY_KR[i]}</span>
              <span className="text-[22px] font-extrabold" style={{ color: INK }}>{w.getDate()}</span>
              <span className="w-[34px] h-[34px] rounded-full grid place-items-center" style={{ background: has ? SAGE_DEEP : SAND }}><Check size={20} color={has ? "#fff" : "#B4A190"} strokeWidth={3} /></span>
            </button>
          );
        })}
      </div>
      <div className="flex-1 mt-3 mx-4 rounded-[32px] p-4 overflow-y-auto d-noscroll" style={{ background: SAND }}>
        <h2 className="text-[24px] font-extrabold mb-3" style={{ color: INK }}>{d.getMonth() + 1}월 {d.getDate()}일 {DAY_KR[monIdx(d)]}요일{isToday && " (오늘)"}</h2>
        {entries.length === 0 && (
          <p className="text-[20px] leading-snug" style={{ color: SUB }}>{isToday ? "아직 오늘의 이야기가 없어요.\n자기 전에 하루 마무리를 해 볼까요?" : "이 날은 나눈 대화가 없어요."}</p>
        )}
        <div className="space-y-4">
          {entries.map((e) => {
            const mo = MOODS[e.mood] || MOODS.soso;
            return (
              <div key={e.id} className="bg-white rounded-3xl p-4" style={{ boxShadow: "0 2px 8px rgba(120,80,40,.08)" }}>
                <div className="flex items-center justify-between mb-3">
                  <span className="text-[20px] font-extrabold flex items-center gap-1" style={{ color: INK }}><Moon size={22} /> {e.time}</span>
                  <span className="flex items-center gap-2">
                    <span className="text-[18px] font-bold rounded-full px-3 py-0.5" style={{ background: mo.bg, color: mo.c }}>{mo.e} {mo.l}</span>
                    <button onClick={() => setConfirmId(e.id)} aria-label={`${e.time} 대화 삭제`} className="w-[52px] h-[52px] shrink-0 rounded-2xl grid place-items-center active:scale-95 transition" style={{ background: "#F6D2CB" }}><Trash2 size={26} color="#8F2A1F" /></button>
                  </span>
                </div>
                <div className="space-y-2">
                  {e.messages.map((m, i) => (
                    <div key={i} className={`flex ${m.from === "user" ? "justify-end" : "justify-start"}`}>
                      <div className="max-w-[88%] px-3 py-2 rounded-2xl text-[19px] leading-snug" style={m.from === "user" ? { background: "#FFE08A", color: INK } : { background: "#FFF3E4", color: INK }}>{m.text}</div>
                    </div>
                  ))}
                </div>
              </div>
            );
          })}
        </div>
      </div>
      <div className="px-5 pb-8 pt-3 shrink-0">
        {isToday ? <Pill onClick={() => go("wrap")} className="w-full"><Moon size={26} /> 오늘 하루 마무리하기</Pill> : <p className="text-center text-[18px] h-[68px] flex items-center justify-center" style={{ color: SUB }}>지난 이야기를 다시 읽거나 지울 수 있어요</p>}
      </div>
      {target && (
        <div className="absolute inset-0 z-40 bg-black/55 grid place-items-center px-6" onClick={() => setConfirmId(null)}>
          <div className="w-full rounded-3xl p-6 d-pop" style={{ background: CREAM }} onClick={(e) => e.stopPropagation()} role="alertdialog" aria-label="대화 삭제 확인">
            <p className="text-[24px] font-extrabold text-center" style={{ color: INK }}>이 대화를 삭제할까요?</p>
            <p className="text-[19px] text-center mt-2 leading-snug" style={{ color: SUB }}>{target.time}에 나눈 이야기가 일기에서 지워져요.<br />지우면 되돌릴 수 없어요.</p>
            <div className="grid grid-cols-2 gap-3 mt-5">
              <Pill variant="sub" onClick={() => setConfirmId(null)}>취소</Pill>
              <Pill onClick={() => { deleteJournal(target.id); setConfirmId(null); }} style={{ background: "#C44536", boxShadow: "none" }}>삭제</Pill>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

      <div className="px-5 pb-9 pt-2 grid grid-cols-2 gap-3 shrink-0">
        <Pill variant="sub" onClick={() => go("settings")}>취소</Pill>
        <Pill variant="sub" onClick={() => setConfirm(true)} style={{ background: "#F6D2CB", color: "#8F2A1F" }}>탈퇴하기</Pill>
      </div>
      {confirm && (
        <div className="absolute inset-0 z-40 bg-black/55 grid place-items-center px-6">
          <div className="w-full rounded-3xl p-6" style={{ background: CREAM }}>
            <p className="text-[24px] font-extrabold text-center" style={{ color: INK }}>정말 탈퇴하시겠어요?</p>
            <p className="text-[19px] text-center mt-2" style={{ color: SUB }}>친구들이 어르신을 많이 그리워할 거예요.</p>
            <div className="grid grid-cols-2 gap-3 mt-5"><Pill variant="sub" onClick={() => setConfirm(false)}>아니요</Pill><Pill onClick={withdraw} style={{ background: "#C44536" }}>탈퇴</Pill></div>
          </div>
        </div>
      )}
    </div>
  );
}

/* ═════════ App ═════════ */
const dayKey = (off) => { const d = new Date(); d.setDate(d.getDate() + off); return keyOf(d); };
const buildTodos = () => [
  { id: 1, text: "당뇨약 먹기", dateKey: dayKey(0), h: 9, m: 0, pm: false, done: true },
  { id: 2, text: "계란, 무 사기", dateKey: dayKey(0), h: 11, m: 0, pm: false, done: false },
  { id: 3, text: "경로당 가기", dateKey: dayKey(0), h: 1, m: 0, pm: true, done: false },
  { id: 4, text: "당뇨약 먹기", dateKey: dayKey(0), h: 6, m: 0, pm: true, done: false },
  { id: 5, text: "내과 정기검진", dateKey: dayKey(3), h: 10, m: 0, pm: false, done: false },
];
const buildJournal = () => {
  const t = new Date();
  if (monIdx(t) === 0) return [];
  return [{
    id: 1, dateKey: dayKey(-1), time: "오후 9:40", mood: "good",
    messages: [
      { from: "bot", text: "하루 마무리 시간이에요 🌙 오늘 이야기를 나눠 볼까요?" },
      { from: "bot", text: "오늘 하루는 어떠셨어요? 기분은 어떠세요?" },
      { from: "user", text: "경로당에서 순자 친구를 만나서 즐거웠단다." },
      { from: "bot", text: "친구분들과 함께하셔서 즐거우셨겠어요." },
      { from: "bot", text: "식사와 약은 잘 챙기셨어요?" },
      { from: "user", text: "약도 잘 챙겨 먹었어." },
      { from: "bot", text: "잘하셨어요! 건강이 제일이에요. 푹 주무세요 🌙" },
    ],
  }];
};

const DEMO_ALARMS = [
  { id: 1, label: "빨래 널기", h: 9, m: 0, pm: false, days: [0, 2], on: true, repeat: true, volume: 60 },
  { id: 2, label: "당뇨약 먹기", h: 10, m: 0, pm: false, days: [0, 1, 2, 3, 4, 5, 6], on: false, repeat: true, volume: 70 },
  { id: 3, label: "장 보러 가기", h: 2, m: 30, pm: true, days: [0, 2], on: true, repeat: true, volume: 60 },
  { id: 4, label: "KBS 6시 내고향", h: 6, m: 0, pm: true, days: [0, 1, 2, 3, 4], on: true, repeat: true, volume: 50 },
];

function App() {
  const [screen, setScreen] = useState(() => new URLSearchParams(location.search).get("screen") === "photo" ? "photo" : "splash");
  const [user, setUser] = useState({ id: "", name: "", birth: "", joined: null });
  const [gender, setGender] = useState("손녀"); // 선택한 캐릭터 id
  const [nick, setNick] = useState("다솜이");
  const [points, setPoints] = useState(1000);
  const [look, setLook] = useState(CHARS[0].look);
  const [owned, setOwned] = useState(ownedFor(CHARS[0]));
  const [todos, setTodos] = useState(buildTodos);
  const [journal, setJournal] = useState(buildJournal);
  const [alarms, setAlarms] = useState(DEMO_ALARMS);
  const [editId, setEditId] = useState(null);
  const [tut, setTut] = useState(null);
  const [ringing, setRinging] = useState(null);
  const [toastMsg, setToastMsg] = useState(null);
  const [cele, setCele] = useState(null);
  const [weather, setWeather] = useState(null);
  useEffect(() => { fetchWeather().then(setWeather); }, []);
  const tt = useRef(null); const ct = useRef(null); const rung = useRef("");

  const toast = (m) => { setToastMsg(m); clearTimeout(tt.current); tt.current = setTimeout(() => setToastMsg(null), 2800); };
  const earn = (n) => setPoints((p) => p + n);
  const go = setScreen;
  const celebrate = (a, b) => { setCele({ a, b, id: Date.now() }); clearTimeout(ct.current); ct.current = setTimeout(() => setCele(null), 2800); };
  const ring = (a) => { setRinging(a); setScreen("ring"); };

  // 체크할 때마다 +10p 와 폭죽, 체크를 취소하면 10p 회수
  const toggleTodo = (id) => {
    const t = todos.find((x) => x.id === id); if (!t) return;
    setTodos((ts) => ts.map((x) => (x.id === id ? { ...x, done: !x.done } : x)));
    if (!t.done) { earn(10); celebrate("일정 완료 포인트", "10p"); }
    else { setPoints((p) => Math.max(0, p - 10)); toast("체크를 취소해서 포인트 10p를 회수했어요"); }
  };
  const addTodo = (sc, src) => setTodos((ts) => [...ts, { id: Date.now() + Math.random(), text: sc.title, dateKey: sc.dateKey, h: sc.h, m: sc.m, pm: sc.pm, done: false, src }]);
  const deleteTodo = (id) => {
    const t = todos.find((x) => x.id === id);
    if (t?.done) setPoints((p) => Math.max(0, p - 10));
    setTodos((ts) => ts.filter((x) => x.id !== id)); toast("일정을 삭제했어요");
  };
  const addJournal = (e) => setJournal((j) => [...j, e]);
  const deleteJournal = (id) => { setJournal((j) => j.filter((e) => e.id !== id)); toast("대화를 삭제했어요"); };

  // 실제 시간이 켜진 알람과 맞으면 알람 화면 표시
  useEffect(() => {
    const i = setInterval(() => {
      if (!user.name || screen === "photo") return;
      const n = new Date(); const stamp = `${keyOf(n)} ${n.getHours()}:${n.getMinutes()}`;
      const hit = alarms.find((a) => a.on && a.days.includes(monIdx(n)) && (a.h % 12) + (a.pm ? 12 : 0) === n.getHours() && a.m === n.getMinutes());
      if (hit && rung.current !== stamp) { rung.current = stamp; ring(hit); }
    }, 5000);
    return () => clearInterval(i);
  }, [alarms, user.name, screen]);

  const applyChar = (id, nk) => {
    const c = charOf(id);
    if (id !== gender || screen === "charSelect") { setLook(c.look); setOwned((o) => [...new Set([...o, ...ownedFor(c)])]); }
    setGender(id); setNick(nk.trim());
  };
  const startService = (id, nk) => {
    applyChar(id, nk); setPoints(1000);
    celebrate("가입 축하 포인트", "1,000p");
    setTimeout(() => { setCele(null); setTut(1); setScreen("main"); }, 2800);
  };
  const withdraw = () => {
    setUser({ id: "", name: "", birth: "", joined: null }); setPoints(1000); setLook(CHARS[0].look);
    setOwned(ownedFor(CHARS[0])); setTodos(buildTodos()); setJournal(buildJournal()); setNick("다솜이"); setGender("손녀"); setScreen("splash");
  };
  const demo = () => { setUser({ id: "demo", name: "김복순", birth: "1948-03-15", joined: Date.now() }); setTut(1); setScreen("main"); };

  const s = { user, setUser, gender, nick, points, setPoints, look, setLook, owned, setOwned, todos, toggleTodo, addTodo, deleteTodo, journal, addJournal, deleteJournal,
    alarms, setAlarms, editId, setEditId, tut, setTut, go, toast, earn, celebrate, ring, ringing, weather,
    setLoggedOut: () => { setScreen("login"); toast("로그아웃 됐어요"); }, withdraw };

  return (
    <div className="min-h-screen flex justify-center items-center md:py-6" style={{ background: "#E9DACA", fontFamily: "'Pretendard','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif", fontSize: 18 }}>
      <style>{`
        @keyframes dFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
        @keyframes dBounce{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-9px) scale(1.03)}}
        @keyframes dRing{0%{box-shadow:0 0 0 0 rgba(232,116,59,.55)}100%{box-shadow:0 0 0 28px rgba(232,116,59,0)}}
        @keyframes dSlide{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
        @keyframes dMouth{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.4)}}
        @keyframes dTap{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
        @keyframes dWiggle{0%,100%{transform:rotate(-10deg)}50%{transform:rotate(10deg)}}
        @keyframes dPop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.1)}100%{transform:scale(1);opacity:1}}
        @keyframes dSpark{0%{transform:translate(0,0) scale(1);opacity:1}70%{opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
        @keyframes dFall{0%{transform:translateY(0) rotate(0);opacity:1}100%{transform:translateY(900px) rotate(720deg);opacity:.9}}
        .d-float{animation:dFloat 3.2s ease-in-out infinite}.d-bounce{animation:dBounce .6s ease-in-out infinite}
        .d-ring{animation:dRing 1.5s ease-out infinite}.d-slide{animation:dSlide .3s ease-out}
        .d-mouth{animation:dMouth .35s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
        .d-tap{animation:dTap 1.1s ease-in-out infinite}.d-wiggle{animation:dWiggle .4s ease-in-out infinite}.d-pop{animation:dPop .45s ease-out}
        .d-spark{animation:dSpark 1.1s ease-out 2 both}.d-fall{animation-name:dFall;animation-timing-function:linear;animation-fill-mode:both}
        .d-noscroll{scrollbar-width:none}.d-noscroll::-webkit-scrollbar{display:none}
        button{-webkit-tap-highlight-color:transparent}
      `}</style>

      <div className={screen === "photo" ? "mission-frame" : "relative w-full max-w-[430px] h-[100dvh] md:h-[860px] md:max-h-[94vh] overflow-hidden md:rounded-[44px] md:border-[10px] md:border-[#33261C] shadow-2xl"} style={{ background: CREAM }}>
        {screen === "splash" && <Splash go={go} />}
        {screen === "login" && <Login go={go} demo={demo} />}
        {screen === "signup" && <Signup go={go} setUser={setUser} />}
        {screen === "profile" && <Profile go={go} setUser={setUser} />}
        {screen === "charSelect" && (
          <CharPick title="캐릭터 선택" initialId={gender} initialNick={nick} current={gender} look={look} back={() => go("profile")}
            onSubmit={(id, nk) => { if (!nk.trim()) return toast("애칭을 정해 주세요"); startService(id, nk); }} submitLabel="시작하기" />
        )}
        {screen === "main" && <Main s={s} />}
        {screen === "customize" && <Customize s={s} />}
        {screen === "settings" && <Settings s={s} />}
        {screen === "myinfo" && <MyInfo s={s} />}
        {screen === "charChange" && (
          <CharPick title="캐릭터 변경" initialId={gender} initialNick={nick} current={gender} look={look} editable back={() => go("settings")}
            onSubmit={(id, nk) => { if (!nk.trim()) return toast("애칭을 정해 주세요"); applyChar(id, nk); toast(`${id} ${nk.trim()}(으)로 바꿨어요!`); go("settings"); }} submitLabel="변경하기" />
        )}
        {screen === "times" && <Times s={s} />}
        {screen === "alarmEdit" && <AlarmEdit s={s} />}
        {screen === "diary" && <Diary s={s} />}
        {screen === "wrap" && <DayWrap s={s} />}
        {screen === "withdraw" && <Withdraw s={s} />}
        {screen === "ring" && ringing && <Ring s={s} openProof={() => go("photo")} />}
        {screen === "photo" && <PhotoProof onConfirm={ringing ? () => earn(10) : undefined}
          onCancel={(completed) => go(ringing ? (completed ? "main" : "ring") : "splash")} />}

        {cele && <Celebrate key={cele.id} a={cele.a} b={cele.b} onClose={() => setCele(null)} />}
        {toastMsg && <div className="absolute left-5 right-5 top-24 z-[60] rounded-2xl px-4 py-3 text-center text-[19px] font-bold text-white d-slide" style={{ background: "rgba(51,38,28,.94)" }} role="status">{toastMsg}</div>}
      </div>
    </div>
  );
}

import { createRoot } from "react-dom/client";
createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
